# wrangler.toml — Cloudflare Pages
#
# ⚠️ Prod bindings WAJIB dikonfigurasi ulang via Pages Dashboard > Settings > Functions
# (pengalaman GoDev). wrangler.toml ini hanya untuk local dev (wrangler pages dev)
# dan referensi; Pages prod memakai binding yg di-set manual di Dashboard.
name = "content-generator"
pages_build_output_dir = "dist"
# drizzle-orm (via functions bundle) import modul node:* → wajib nodejs_compat
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NEXT_PUBLIC_APP_NAME = "AI Auto Content Generator"

# NOTE: Durable Object binding (QUEUE/Queue) untuk Pages WAJIB di-set via
# Dashboard > Settings > Functions > Durable Object bindings.
# Tidak boleh ada di wrangler.toml — Pages config validation reject (wrangler v4).

# D1 binding — migrations dijalankan via npm script db:migrate:* (lihat package.json).
[[d1_databases]]
binding = "DB"
database_name = "content-generator"
# Cara dapat database_id: jalankan `wrangler d1 create content-generator`,
# lalu salin id yg dihasilkan ke sini. Untuk local dev placeholder ini OK.
database_id = "103ffeac-1fd7-45cf-82f0-2b8f44322103"
migrations_dir = "db/migrations"

# KV binding.
# NOTE: id di-set via Dashboard untuk prod; placeholder ini untuk local dev
# (wrangler pages dev). Ganti dengan id asli sebelum deploy.
[[kv_namespaces]]
binding = "KV"
id = "6806b090fb0e46e68185cc3a948842ab"
